<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title description">
<title id="title">BiLSTM sentiment classifier</title>
<desc id="description">Token IDs are embedded to 128 dimensions, passed through two bidirectional LSTM layers with hidden size 128 per direction, then the final directional hidden states are concatenated and classified into five logits.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F82DF"/></marker>
  <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98A2B3"/></marker>
  <style>
    .heading{font:600 27px Georgia,serif;fill:#172b4d}
    .label{font:600 17px Georgia,serif;fill:#172b4d}
    .small{font:14px Georgia,serif;fill:#344054}
    .shape{font:13px ui-monospace,monospace;fill:#475467}
    .note{font:13px Georgia,serif;fill:#667085}
    .count{font:600 18px Georgia,serif;fill:#172b4d}
    .arrow{fill:none;stroke:#0F82DF;stroke-width:1.8;marker-end:url(#arrow)}
    .muted-arrow{fill:none;stroke:#98A2B3;stroke-width:1.6;marker-end:url(#arrowGray)}
    .input{fill:#E5E7EB;stroke:#6B7280;stroke-width:1.5}
    .process{fill:#FCE4D6;stroke:#E87524;stroke-width:1.5}
    .model{fill:#FCE4D6;stroke:#E87524;stroke-width:1.5}
    .frozen{fill:#EAF2F8;stroke:#528BBD;stroke-width:1.6}
    .output{fill:#E5E7EB;stroke:#6B7280;stroke-width:1.5}
    .trainable{fill:#FCE4D6;stroke:#E87524;stroke-width:1.5}
    .frozen-outline{fill:#EAF2F8;stroke:#528BBD;stroke-width:1.6;stroke-dasharray:7 4}
  </style>
  
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="800" y="48" text-anchor="middle" class="heading">BiLSTM sentiment classifier</text><rect x="35" y="170" width="180" height="115" rx="12" class="input"/><text x="125.0" y="220.5" text-anchor="middle" class="label">Token IDs</text><text x="125.0" y="250.5" text-anchor="middle" class="shape">[B, L]</text><path d="M 222 227 L 255 227" class="arrow"/><rect x="260" y="170" width="190" height="115" rx="12" class="process"/><text x="355.0" y="204.5" text-anchor="middle" class="label">Embedding</text><text x="355.0" y="229.5" text-anchor="middle" class="small">[B, L, 128]</text><text x="355.0" y="254.5" text-anchor="middle" class="shape">128 dimensions</text><path d="M 457 227 L 490 227" class="arrow"/><rect x="495" y="170" width="235" height="115" rx="12" class="model"/><text x="612.5" y="204.5" text-anchor="middle" class="label">BiLSTM layer 1</text><text x="612.5" y="229.5" text-anchor="middle" class="small">[B, L, 256]</text><text x="612.5" y="254.5" text-anchor="middle" class="shape">bidirectional · hidden 128</text><path d="M 737 227 L 770 227" class="arrow"/><rect x="775" y="170" width="235" height="115" rx="12" class="model"/><text x="892.5" y="204.5" text-anchor="middle" class="label">BiLSTM layer 2</text><text x="892.5" y="229.5" text-anchor="middle" class="small">[B, L, 256]</text><text x="892.5" y="254.5" text-anchor="middle" class="shape">bidirectional · hidden 128</text><path d="M 1017 227 L 1050 227" class="arrow"/><rect x="1055" y="170" width="220" height="115" rx="12" class="process"/><text x="1165.0" y="204.5" text-anchor="middle" class="label">Final hidden states</text><text x="1165.0" y="229.5" text-anchor="middle" class="small">[B, 256]</text><text x="1165.0" y="254.5" text-anchor="middle" class="shape">hₙ forward + hₙ backward</text><path d="M 1282 227 L 1315 227" class="arrow"/><rect x="1320" y="170" width="245" height="115" rx="12" class="output"/><text x="1442.5" y="204.5" text-anchor="middle" class="label">Linear classifier</text><text x="1442.5" y="229.5" text-anchor="middle" class="small">[B, 5]</text><text x="1442.5" y="254.5" text-anchor="middle" class="shape">256 → 5 logits</text><text x="800" y="340" text-anchor="middle" class="small">Concatenate the final forward and backward hidden states from the second BiLSTM layer.</text><line x1="35" y1="385" x2="1565" y2="385" stroke="#D0D5DD" stroke-width="1"/><text x="800" y="425" text-anchor="middle" class="count">Output: 5 sentiment-class logits</text><text x="800" y="458" text-anchor="middle" class="note">B = batch size · L = padded sequence length · each direction has hidden size 128</text>
</svg>