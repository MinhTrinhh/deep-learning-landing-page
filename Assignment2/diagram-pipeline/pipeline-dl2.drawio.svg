<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" role="img" aria-labelledby="title description">
<title id="title">Training and evaluation workflow</title>
<desc id="description">Tokenize data, split into training and test subsets, train and validate, restore the best validation checkpoint, then test once.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F82DF"/></marker>
  <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98A2B3"/></marker>
  <style>
    .heading{font:600 27px Georgia,serif;fill:#172b4d}
    .label{font:600 17px Georgia,serif;fill:#172b4d}
    .small{font:14px Georgia,serif;fill:#344054}
    .shape{font:13px ui-monospace,monospace;fill:#475467}
    .note{font:13px Georgia,serif;fill:#667085}
    .count{font:600 18px Georgia,serif;fill:#172b4d}
    .arrow{fill:none;stroke:#0F82DF;stroke-width:1.8;marker-end:url(#arrow)}
    .muted-arrow{fill:none;stroke:#98A2B3;stroke-width:1.6;marker-end:url(#arrowGray)}
    .input{fill:#E5E7EB;stroke:#6B7280;stroke-width:1.5}
    .process{fill:#FCE4D6;stroke:#E87524;stroke-width:1.5}
    .model{fill:#FCE4D6;stroke:#E87524;stroke-width:1.5}
    .frozen{fill:#EAF2F8;stroke:#528BBD;stroke-width:1.6}
    .output{fill:#E5E7EB;stroke:#6B7280;stroke-width:1.5}
    .trainable{fill:#FCE4D6;stroke:#E87524;stroke-width:1.5}
    .frozen-outline{fill:#EAF2F8;stroke:#528BBD;stroke-width:1.6;stroke-dasharray:7 4}
  </style>
  
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="750" y="48" text-anchor="middle" class="heading">Training and evaluation workflow</text><rect x="35" y="130" width="190" height="112" rx="12" class="input"/><text x="130.0" y="179.0" text-anchor="middle" class="label">Tokenize</text><text x="130.0" y="209.0" text-anchor="middle" class="shape">raw text → input_ids</text><rect x="275" y="130" width="190" height="112" rx="12" class="process"/><text x="370.0" y="179.0" text-anchor="middle" class="label">Train / test split</text><text x="370.0" y="209.0" text-anchor="middle" class="shape">fixed random seed</text><rect x="515" y="130" width="190" height="112" rx="12" class="process"/><text x="610.0" y="179.0" text-anchor="middle" class="label">Train model</text><text x="610.0" y="209.0" text-anchor="middle" class="shape">training subset</text><rect x="755" y="130" width="190" height="112" rx="12" class="process"/><text x="850.0" y="179.0" text-anchor="middle" class="label">Validate</text><text x="850.0" y="209.0" text-anchor="middle" class="shape">each epoch</text><rect x="995" y="130" width="210" height="112" rx="12" class="process"/><text x="1100.0" y="179.0" text-anchor="middle" class="label">Restore best</text><text x="1100.0" y="209.0" text-anchor="middle" class="shape">validation checkpoint</text><rect x="1255" y="130" width="210" height="112" rx="12" class="output"/><text x="1360.0" y="179.0" text-anchor="middle" class="label">Test once</text><text x="1360.0" y="209.0" text-anchor="middle" class="shape">held-out test set</text><path d="M 232 186.0 L 267 186.0" class="arrow"/><path d="M 472 186.0 L 507 186.0" class="arrow"/><path d="M 712 186.0 L 747 186.0" class="arrow"/><path d="M 952 186.0 L 987 186.0" class="arrow"/><path d="M 1212 186.0 L 1247 186.0" class="arrow"/><path d="M 610 260 V 305 H 850 V 260" fill="none" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="5 4"/><text x="730" y="330" text-anchor="middle" class="note">Repeat training / validation across epochs</text><line x1="35" y1="360" x2="1465" y2="360" stroke="#D0D5DD" stroke-width="1"/><text x="750" y="395" text-anchor="middle" class="small">Select the checkpoint using validation performance; evaluate the test set only after model selection.</text>
</svg>