<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description" style="color-scheme: only light">
  <title id="title">Linear Softmax model architecture</title>
  <desc id="description">Fashion-MNIST image input is flattened to 784 features and passed through one linear layer producing 10 logits.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f82df"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 15px Arial, sans-serif; fill: #64748b; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .detail { font: 14px Arial, sans-serif; fill: #475569; }
      .shape { font: 700 14px Arial, sans-serif; fill: #0f82df; }
      .arrow-label { font: 13px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1200" height="440" rx="22" fill="#f8fafc"/>
  <text x="50" y="54" class="title">Linear / Softmax Baseline</text>
  <text x="50" y="82" class="subtitle">A single learned affine transformation maps normalized pixels directly to class logits.</text>

  <g filter="url(#shadow)">
    <rect x="50" y="145" width="220" height="150" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="340" y="145" width="200" height="150" rx="18" fill="#eaf6fc" stroke="#0f82df" stroke-width="2"/>
    <rect x="610" y="145" width="250" height="150" rx="18" fill="#dbeafe" stroke="#0f82df" stroke-width="2"/>
    <rect x="930" y="145" width="220" height="150" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  </g>

  <text x="160" y="190" text-anchor="middle" class="label">Input image</text>
  <text x="160" y="224" text-anchor="middle" class="shape">[B, 1, 28, 28]</text>
  <text x="160" y="254" text-anchor="middle" class="detail">Fashion-MNIST</text>

  <text x="440" y="190" text-anchor="middle" class="label">Flatten</text>
  <text x="440" y="224" text-anchor="middle" class="shape">[B, 784]</text>
  <text x="440" y="254" text-anchor="middle" class="detail">No learned parameters</text>

  <text x="735" y="186" text-anchor="middle" class="label">Linear layer</text>
  <text x="735" y="218" text-anchor="middle" class="shape">784 → 10</text>
  <text x="735" y="248" text-anchor="middle" class="detail">Weight + bias</text>
  <text x="735" y="272" text-anchor="middle" class="detail">7,850 parameters</text>

  <text x="1040" y="190" text-anchor="middle" class="label">Output logits</text>
  <text x="1040" y="224" text-anchor="middle" class="shape">[B, 10]</text>
  <text x="1040" y="254" text-anchor="middle" class="detail">CrossEntropyLoss</text>

  <g fill="none" stroke="#0f82df" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 270 220 H 330"/>
    <path d="M 540 220 H 600"/>
    <path d="M 860 220 H 920"/>
  </g>

  <text x="50" y="365" class="label">Total trainable parameters: 7,850</text>
  <text x="50" y="394" class="subtitle">The model has no hidden layer or spatial inductive bias.</text>
</svg>
