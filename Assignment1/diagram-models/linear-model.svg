<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img" aria-labelledby="title description">
<title id="title">Linear / Softmax architecture</title>
<desc id="description">Left-to-right model architecture showing tensor shapes and 7,850 total trainable parameters.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F82DF"/></marker>
<style>.heading{font:600 27px Georgia,serif;fill:#172b4d}.label{font:600 17.0px Georgia,serif;fill:#172b4d}.shape{font:13.0px ui-monospace,monospace;fill:#475467}.count{font:600 19px Georgia,serif;fill:#172b4d}</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="700" y="48" text-anchor="middle" class="heading">Linear / Softmax</text>
<rect x="40.0" y="112" width="313.5" height="108" rx="0" fill="#E5E7EB" stroke="#6B7280" stroke-width="1.5"/>
<text x="196.8" y="155" text-anchor="middle" class="label">Image</text>
<text x="196.8" y="185" text-anchor="middle" class="shape">[B, 1, 28, 28]</text>
<path d="M 356.5 166.0 H 370.5" fill="none" stroke="#0F82DF" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="375.5" y="112" width="313.5" height="108" rx="13" fill="#FCE4D6" stroke="#E87524" stroke-width="1.5"/>
<text x="532.2" y="155" text-anchor="middle" class="label">Flatten</text>
<text x="532.2" y="185" text-anchor="middle" class="shape">[B, 784]</text>
<path d="M 692.0 166.0 H 706.0" fill="none" stroke="#0F82DF" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="711.0" y="112" width="313.5" height="108" rx="13" fill="#FCE4D6" stroke="#E87524" stroke-width="1.5"/>
