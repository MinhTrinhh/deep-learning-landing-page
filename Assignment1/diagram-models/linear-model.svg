<text x="867.8" y="185" text-anchor="middle" class="shape">[B, 10]</text>
<path d="M 1027.5 166.0 H 1041.5" fill="none" stroke="#0F82DF" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="1046.5" y="112" width="313.5" height="108" rx="0" fill="#E5E7EB" stroke="#6B7280" stroke-width="1.5"/>
