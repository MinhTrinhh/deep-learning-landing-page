<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title description" style="color-scheme: only light">
  <title id="title">Gated recurrent unit model architecture</title>
  <desc id="description">Each Fashion-MNIST image is read as a sequence of 28 rows. A single GRU with 128 hidden units encodes the row sequence, then dropout and a linear classifier produce ten logits.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f82df"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 15px Arial, sans-serif; fill: #64748b; }
      .section { font: 700 13px Arial, sans-serif; fill: #0369a1; letter-spacing: 1.5px; }
      .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .detail { font: 13px Arial, sans-serif; fill: #475569; }
      .shape { font: 700 13px Arial, sans-serif; fill: #0f82df; }
      .gate { font: 700 12px Arial, sans-serif; fill: #0369a1; }
    </style>
  </defs>

  <rect width="1800" height="600" rx="22" fill="#f8fafc"/>
  <text x="50" y="54" class="title">Gated Recurrent Unit</text>
  <text x="50" y="82" class="subtitle">A 28×28 image becomes a top-to-bottom row sequence; the final recurrent state summarizes the image for classification.</text>

  <rect x="215" y="110" width="830" height="330" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="240" y="140" class="section">SEQUENCE ENCODER</text>
  <rect x="1200" y="110" width="550" height="330" rx="24" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="1225" y="140" class="section" style="fill:#047857">CLASSIFIER</text>

  <g filter="url(#shadow)">
    <rect x="30" y="190" width="150" height="180" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="255" y="165" width="230" height="230" rx="18" fill="#dbeafe" stroke="#0f82df" stroke-width="2"/>
    <rect x="545" y="155" width="330" height="250" rx="18" fill="#dbeafe" stroke="#0f82df" stroke-width="2"/>
    <rect x="935" y="190" width="150" height="180" rx="18" fill="#eaf6fc" stroke="#0f82df" stroke-width="2"/>
    <rect x="1145" y="190" width="150" height="180" rx="18" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <rect x="1355" y="175" width="240" height="210" rx="18" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <rect x="1655" y="190" width="115" height="180" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  </g>

  <text x="105" y="235" text-anchor="middle" class="label">Input</text>
  <text x="105" y="271" text-anchor="middle" class="shape">[B, 1, 28, 28]</text>
  <text x="105" y="310" text-anchor="middle" class="detail">Grayscale image</text>

  <text x="370" y="207" text-anchor="middle" class="label">Row sequence</text>
  <text x="370" y="241" text-anchor="middle" class="shape">[B, 28, 28]</text>
  <text x="370" y="275" text-anchor="middle" class="detail">Squeeze channel axis</text>
  <text x="370" y="304" text-anchor="middle" class="detail">28 ordered time steps</text>
  <text x="370" y="333" text-anchor="middle" class="detail">28 pixel features / step</text>

  <text x="710" y="198" text-anchor="middle" class="label">GRU sequence encoder</text>
  <text x="710" y="230" text-anchor="middle" class="shape">Input 28 → Hidden 128</text>
  <text x="710" y="260" text-anchor="middle" class="detail">1 layer · batch_first=True</text>
  <g>
    <rect x="590" y="282" width="66" height="36" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="677" y="282" width="66" height="36" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="764" y="282" width="66" height="36" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text x="623" y="305" text-anchor="middle" class="gate">reset</text>
    <text x="710" y="305" text-anchor="middle" class="gate">update</text>
    <text x="797" y="305" text-anchor="middle" class="gate">candidate</text>
  </g>
  <text x="710" y="348" text-anchor="middle" class="detail">60,672 parameters</text>
  <text x="710" y="375" text-anchor="middle" class="detail">Shared weights across 28 steps</text>

  <text x="1010" y="235" text-anchor="middle" class="label">Final state</text>
  <text x="1010" y="271" text-anchor="middle" class="shape">h₍₂₈₎ [B, 128]</text>
  <text x="1010" y="310" text-anchor="middle" class="detail">Last-layer summary</text>

  <text x="1220" y="235" text-anchor="middle" class="label">Dropout</text>
  <text x="1220" y="271" text-anchor="middle" class="shape">p = 0.2</text>
  <text x="1220" y="310" text-anchor="middle" class="detail">Training only</text>

  <text x="1475" y="225" text-anchor="middle" class="label">Linear classifier</text>
  <text x="1475" y="261" text-anchor="middle" class="shape">128 → 10</text>
  <text x="1475" y="298" text-anchor="middle" class="detail">Ten class scores</text>
  <text x="1475" y="332" text-anchor="middle" class="detail">1,290 parameters</text>

  <text x="1712" y="235" text-anchor="middle" class="label">Logits</text>
  <text x="1712" y="271" text-anchor="middle" class="shape">[B, 10]</text>
  <text x="1712" y="310" text-anchor="middle" class="detail">Cross entropy</text>

  <g fill="none" stroke="#0f82df" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 180 280 H 245"/>
    <path d="M 485 280 H 535"/>
    <path d="M 875 280 H 925"/>
    <path d="M 1085 280 H 1135"/>
    <path d="M 1295 280 H 1345"/>
    <path d="M 1595 280 H 1645"/>
  </g>

  <text x="50" y="505" class="label">Total trainable parameters: 61,962</text>
  <text x="50" y="534" class="subtitle">The GRU contributes 60,672 parameters; the final linear classifier contributes 1,290.</text>
  <text x="50" y="560" class="subtitle">The compact recurrent model achieved 88.36% test accuracy and 0.8821 macro F1.</text>
</svg>
